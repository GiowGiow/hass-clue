name: Validate with HACS

# Manual only while the repository is private: HACS reads public GitHub data
# and cannot validate a private repository. Add push/pull_request triggers
# once the repository goes public.
on:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
